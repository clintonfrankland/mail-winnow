protocols = imap
listen = *

# IMAPS only: password authentication always requires TLS.
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/dovecot/local/tls/cert.pem
ssl_key = </etc/dovecot/local/tls/key.pem
disable_plaintext_auth = yes

auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/local/users
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/vhosts/%d/%n
}

# Each account has a distinct Maildir; authenticated clients have their own namespace.
mail_home = /var/mail/vhosts/%d/%n
mail_location = maildir:~/Maildir
namespace inbox {
  inbox = yes
}

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
