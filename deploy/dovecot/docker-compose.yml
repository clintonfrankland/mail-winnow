services:
  dovecot:
    build:
      context: .
    environment:
      DOVECOT_TLS_COMMON_NAME: ${DOVECOT_TLS_COMMON_NAME:-mail.example.test}
    ports:
      - "${DOVECOT_IMAPS_PORT:-993}:993"
    volumes:
      - type: bind
        source: ${DOVECOT_CONFIG_DIR:-./config}
        target: /etc/dovecot/local
      - dovecot-mail:/var/mail/vhosts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "printf 'a logout\\r\\n' | timeout 5 openssl s_client -quiet -connect 127.0.0.1:993 2>/dev/null | grep -q '^\\* OK'"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 10s

volumes:
  dovecot-mail:
